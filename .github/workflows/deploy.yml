name: Deploy a Cloud Run

on:
  push:
    branches: [main]

permissions:
  contents: read

env:
  # Proyecto Operaciones: ahí viven el servicio Cloud Run "diplomados",
  # su instancia de Cloud SQL y los secretos que consume.
  PROJECT_ID: gen-lang-client-0049269139
  REGION: us-central1
  ARTIFACT_REPO: diplomados
  SERVICE: diplomados

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - name: Build y push de la imagen
        run: |
          IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/${ARTIFACT_REPO}/app:${{ github.sha }}"
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Deploy a Cloud Run
        run: |
          gcloud run deploy "$SERVICE" \
            --project="$PROJECT_ID" \
            --image="$IMAGE" \
            --region="$REGION" \
            --service-account="203821029278-compute@developer.gserviceaccount.com" \
            --add-cloudsql-instances="${{ vars.INSTANCE_CONNECTION_NAME }}" \
            --set-env-vars="GCS_BUCKET=${{ vars.GCS_BUCKET }},NEXT_PUBLIC_SITE_URL=${{ vars.NEXT_PUBLIC_SITE_URL }}" \
            --set-secrets="DATABASE_URL=database-url:latest,JWT_SECRET=jwt-secret:latest" \
            --allow-unauthenticated \
            --quiet

      # El servicio quedó con el tráfico anclado a una revisión antigua desde la
      # consola, lo que hacía que los deploys crearan revisiones sin recibir
      # tráfico y el workflow terminara en verde sin publicar nada.
      - name: Enviar el tráfico a la revisión recién desplegada
        run: |
          gcloud run services update-traffic "$SERVICE" \
            --project="$PROJECT_ID" \
            --region="$REGION" \
            --to-latest \
            --quiet
