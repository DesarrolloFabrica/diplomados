name: Deploy a Cloud Run

on:
  push:
    branches: [main]

permissions:
  contents: read

env:
  # Proyecto Operaciones: ahí vive el servicio Cloud Run "diplomados".
  # Cloud SQL sigue en it-fab (se pasa por vars.INSTANCE_CONNECTION_NAME).
  PROJECT_ID: gen-lang-client-0049269139
  REGION: us-central1
  ARTIFACT_REPO: diplomados
  SERVICE: diplomados

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - name: Asegurar Artifact Registry
        run: |
          gcloud artifacts repositories describe "$ARTIFACT_REPO" \
            --location="$REGION" >/dev/null 2>&1 || \
          gcloud artifacts repositories create "$ARTIFACT_REPO" \
            --repository-format=docker \
            --location="$REGION" \
            --description="Imagenes del servicio diplomados"

      - name: Build y push de la imagen
        run: |
          IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/${ARTIFACT_REPO}/app:${{ github.sha }}"
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Deploy a Cloud Run
        run: |
          gcloud run deploy "$SERVICE" \
            --project="$PROJECT_ID" \
            --image="$IMAGE" \
            --region="$REGION" \
            --service-account="${{ vars.RUNTIME_SERVICE_ACCOUNT }}" \
            --add-cloudsql-instances="${{ vars.INSTANCE_CONNECTION_NAME }}" \
            --set-env-vars="INSTANCE_CONNECTION_NAME=${{ vars.INSTANCE_CONNECTION_NAME }},DB_USER=app_user,DB_NAME=${{ vars.DB_NAME }},GCS_BUCKET=${{ vars.GCS_BUCKET }},NEXT_PUBLIC_SITE_URL=${{ vars.NEXT_PUBLIC_SITE_URL }}" \
            --set-secrets="DB_PASSWORD=db-password:latest,JWT_SECRET=jwt-secret:latest,SENDGRID_API_KEY=sendgrid-api-key:latest" \
            --allow-unauthenticated \
            --quiet
